name: notify
# Telegram: link the chat when ops/telegram-setup.trigger changes; daily digest at 03:30 UTC (09:00 IST).
on:
  push:
    paths: ["ops/telegram-setup.trigger"]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
concurrency:
  group: notify
jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      CHANNEL_NAME: Stackby
      MEDIA_REPO: ${{ vars.MEDIA_REPO || 'stackbyhq/stackby-reels-media' }}
      SHEET_ID: ${{ vars.SHEET_ID || '1OTJRHzf1OUDkENIs_dq3IPuvicJAN7nk29tSMHI6hV8' }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID || '17841407791849179' }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT || github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/setup_check.py
      - if: github.event_name == 'push'
        run: python scripts/notify.py setup
      - if: github.event_name != 'push'
        run: python scripts/notify.py digest
